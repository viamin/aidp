name: Work Loop Initial Prompt
description: >
  Initial work loop prompt shown to the coding agent before the first
  iteration, including explicit PROMPT.md path guidance.
version: "1.0.0"
category: work_loop
tier: standard
cache_ttl: null

prompt: |
  # Work Loop: {{STEP_NAME}}

  ## Instructions
  You are working in a work loop. Your responsibilities:
  1. Read this file (`.aidp/PROMPT.md`) to understand what needs to be done
  2. Complete the work described below
  3. **IMPORTANT**: Edit this `.aidp/PROMPT.md` file to:
     - Remove completed items
     - Update with current status
     - Keep it concise (remove unnecessary context)
     - Mark the step COMPLETE when 100% done
  4. After you finish, tests and linters will run automatically
  5. If tests/linters fail, you'll see the errors in the next iteration

  ## Completion Criteria
  Mark this step COMPLETE by adding this line to `.aidp/PROMPT.md`:
  ```
  STATUS: COMPLETE
  ```

  {{USER_INPUT_SECTION}}{{PREVIOUS_AGENT_SUMMARY_SECTION}}{{DETERMINISTIC_OUTPUTS_SECTION}}{{STYLE_GUIDE_SECTION}}{{PRD_SECTION}}## Task Template
  {{TASK_TEMPLATE}}

variables:
  - STEP_NAME
  - USER_INPUT_SECTION
  - PREVIOUS_AGENT_SUMMARY_SECTION
  - DETERMINISTIC_OUTPUTS_SECTION
  - STYLE_GUIDE_SECTION
  - PRD_SECTION
  - TASK_TEMPLATE
